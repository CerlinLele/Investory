[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investory"
version = "0.1.0"
description = "Investory project skeleton."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.1",
    "langchain==1.3.1",
    "langchain-openai==1.2.1",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.1",
    "pdfplumber==0.11.9",
    "pydantic==2.13.3",
    "python-multipart==0.0.32",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
investory = "investory.main:main"
investory-smoke = "investory.agent_core.runtime.smoke.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
