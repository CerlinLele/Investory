[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investory"
version = "0.1.0"
description = "Investory project skeleton."
requires-python = ">=3.10"
dependencies = [
    "langchain==1.2.15",
    "langchain-openai==1.2.1",
    "pydantic==2.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
investory = "investory.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
